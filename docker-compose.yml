version: '3.8'

services:
  # ── Spatial Database: PostgreSQL + PostGIS ─────────────────────────
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: nershield_postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nershield_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nershield -d nershield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── In-Memory Telemetry & Cache: Redis ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nershield_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nershield_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nershield:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nershield_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  # ── Next.js Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nershield_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
